name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Quality and Vitest
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9.12.3
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          check-latest: false
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Bootstrap workspace
        run: pnpm bootstrap

      - name: Audit dependencies
        run: pnpm security:audit

      - name: Lint, typecheck and build
        run: pnpm check

      - name: Run Vitest suites with coverage
        run: pnpm test:coverage

      - name: Upload Vitest coverage and test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitest-reports-attempt-${{ github.run_attempt }}
          path: |
            coverage/summary.md
            apps/backend-service/coverage
            apps/booking-engine-service/coverage
            apps/pms/coverage
            packages/shared/coverage
          if-no-files-found: warn
          retention-days: 7

  e2e:
    name: Playwright E2E, visual and accessibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9.12.3
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          check-latest: false
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Bootstrap workspace
        run: pnpm bootstrap

      - name: Install Chromium
        run: pnpm --filter @hotel/pms exec playwright install chromium --with-deps

      - name: Run Playwright suites
        run: pnpm test:e2e
        env:
          PMS_E2E_PORT: "3001"
          PMS_E2E_BACKEND_PORT: "4334"

      - name: Upload Playwright failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-ui-results-attempt-${{ github.run_attempt }}
          path: |
            node_modules/.cache/pms-playwright-results
            node_modules/.cache/pms-playwright-report
            apps/pms/__tests__/e2e/__screenshots__/linux
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  database:
    name: Database integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9.12.3
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          check-latest: false
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Bootstrap workspace
        run: pnpm bootstrap

      - name: Run database integration suites
        run: pnpm test:db

      - name: Remove local database containers
        if: ${{ always() }}
        continue-on-error: true
        run: pnpm exec supabase stop --no-backup
